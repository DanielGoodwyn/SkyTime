<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>SkyTime — Begin with Google</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background: radial-gradient(ellipse at 50% 30%, #15264a 0%, #070c1a 75%, #02040a 100%);
      color: #ffffff;
      -webkit-font-smoothing: antialiased;
    }
    .card {
      background: rgba(14, 22, 44, 0.88);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 24px;
      padding: 36px 28px;
      max-width: 360px;
      width: 100%;
      text-align: center;
      box-shadow: 0 20px 48px rgba(0, 0, 0, 0.6), 0 0 40px rgba(242, 140, 66, 0.15);
    }
    .logo-wrap {
      display: inline-block;
      margin-bottom: 16px;
      position: relative;
    }
    .logo {
      width: 72px;
      height: 72px;
      border-radius: 50%;
      display: block;
      box-shadow: 0 0 24px rgba(242, 140, 66, 0.45);
    }
    h2 {
      font-size: 24px;
      font-weight: 600;
      letter-spacing: 0.04em;
      margin-bottom: 8px;
      background: linear-gradient(135deg, #ffffff 40%, #f6c085 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    p {
      font-size: 13px;
      line-height: 1.5;
      color: rgba(255, 255, 255, 0.72);
      margin-bottom: 28px;
      letter-spacing: 0.02em;
    }
    .btn-google {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      width: 100%;
      padding: 14px 18px;
      background: #ffffff;
      color: #1f2937;
      border: none;
      border-radius: 14px;
      font-weight: 600;
      font-size: 15px;
      cursor: pointer;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.25);
      transition: transform 0.15s ease, background-color 0.15s;
    }
    .btn-google:active {
      transform: scale(0.98);
      background: #f1f5f9;
    }
    .status {
      margin-top: 20px;
      font-size: 13px;
      color: rgba(255, 255, 255, 0.75);
      min-height: 20px;
      line-height: 1.4;
    }
    .spinner {
      display: none;
      width: 22px;
      height: 22px;
      border: 2px solid rgba(255, 255, 255, 0.25);
      border-top-color: #f28c42;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 14px auto 0 auto;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .manual-link {
      display: none;
      margin-top: 18px;
      padding: 11px 18px;
      background: #f28c42;
      color: #fff;
      text-decoration: none;
      border-radius: 10px;
      font-weight: 600;
      font-size: 14px;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo-wrap">
      <img src="favicon.svg" class="logo" alt="SkyTime">
    </div>
    <h2>Begin SkyTime</h2>
    <p>Sign in with your Google account to sync SkyTime across all your devices.</p>

    <button id="googleBtn" class="btn-google" onclick="startSignIn()">
      <svg width="18" height="18" viewBox="0 0 24 24">
        <path fill="#4285F4" d="M23.745 12.27c0-.7-.06-1.4-.19-2.07H12v4.51h6.6c-.29 1.52-1.14 2.8-2.4 3.65v3.03h3.88c2.27-2.09 3.66-5.17 3.66-9.12z"/>
        <path fill="#34A853" d="M12 24c3.24 0 5.95-1.08 7.93-2.91l-3.88-3.03c-1.08.72-2.45 1.16-4.05 1.16-3.12 0-5.77-2.1-6.72-4.93H1.24v3.13C3.26 21.36 7.33 24 12 24z"/>
        <path fill="#FBBC05" d="M5.28 14.29c-.25-.72-.38-1.49-.38-2.29s.13-1.57.38-2.29V6.58H1.24C.45 8.15 0 9.92 0 12s.45 3.85 1.24 5.42l4.04-3.13z"/>
        <path fill="#EA4335" d="M12 4.75c1.77 0 3.35.61 4.6 1.8l3.42-3.42C17.95 1.19 15.24 0 12 0 7.33 0 3.26 2.64 1.24 6.58l4.04 3.13c.95-2.83 3.6-4.96 6.72-4.96z"/>
      </svg>
      <span id="googleBtnText">Begin with Google</span>
    </button>

    <div id="spinner" class="spinner"></div>
    <div id="status" class="status"></div>
    <a id="manualReturnLink" class="manual-link" href="#">Return to SkyTime</a>
  </div>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyCzUEuK46_qHYzxSS07GAprhtupTYsBNbs",
      authDomain: "goodwyn-babynames.firebaseapp.com",
      projectId: "goodwyn-babynames",
      storageBucket: "goodwyn-babynames.appspot.com",
      messagingSenderId: "338871638321",
      appId: "1:338871638321:web:5ee1aa81a04d3856b3e94e"
    };

    if (!firebase.apps.length) {
      firebase.initializeApp(firebaseConfig);
    }
    const auth = firebase.auth();
    let isCompleting = false;

    function setStatus(text, showSpinner) {
      document.getElementById('status').innerText = text;
      document.getElementById('spinner').style.display = showSpinner ? 'block' : 'none';
    }

    // Auth state listener: fires as soon as Google authentication succeeds
    auth.onAuthStateChanged(function(user) {
      if (user) {
        completeAuth(user);
      }
    });

    // Check redirect result in case of redirect fallback
    auth.getRedirectResult().then(function(result) {
      if (result && result.user) {
        completeAuth(result.user);
      }
    }).catch(function(err) {
      console.warn("Redirect result error:", err);
      setStatus(err.message, false);
    });

    function startSignIn() {
      setStatus("Opening Google Sign-In...", true);
      document.getElementById('googleBtn').style.opacity = '0.6';

      const provider = new firebase.auth.GoogleAuthProvider();
      provider.addScope('email');
      provider.addScope('profile');

      auth.signInWithPopup(provider).then(function(result) {
        if (result && result.user) {
          completeAuth(result.user);
        }
      }).catch(function(err) {
        console.warn("Popup error:", err);
        if (err.code === 'auth/popup-blocked' || err.code === 'auth/popup-closed-by-user' || err.code === 'auth/cancelled-popup-request') {
          setStatus("Redirecting to Google...", true);
          auth.signInWithRedirect(provider);
        } else {
          setStatus(err.message, false);
          document.getElementById('googleBtn').style.opacity = '1';
        }
      });
    }

    function completeAuth(user) {
      if (isCompleting || !user) return;
      isCompleting = true;
      setStatus("Signed in as " + (user.email || user.displayName) + "! Returning to SkyTime...", true);

      user.getIdToken(true).then(function(token) {
        const callback = "skytime-auth://auth?" +
          "uid=" + encodeURIComponent(user.uid) +
          "&email=" + encodeURIComponent(user.email || "") +
          "&displayName=" + encodeURIComponent(user.displayName || "") +
          "&idToken=" + encodeURIComponent(token) +
          "&refreshToken=" + encodeURIComponent(user.refreshToken || "");

        const link = document.getElementById('manualReturnLink');
        if (link) {
          link.href = callback;
          link.style.display = 'inline-block';
        }

        window.location.href = callback;
      }).catch(function(err) {
        isCompleting = false;
        setStatus("Error retrieving token: " + err.message, false);
      });
    }

    // Check if user is already signed in on page load
    auth.onAuthStateChanged(function(user) {
      if (user) {
        completeAuth(user);
      }
    });
  </script>
</body>
</html>
