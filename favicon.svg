<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- 6am SkyTime Sunrise Gradient -->
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#18367a"/>
      <stop offset="26%" stop-color="#3c4a92"/>
      <stop offset="52%" stop-color="#7c4e88"/>
      <stop offset="76%" stop-color="#bf5c6c"/>
      <stop offset="100%" stop-color="#f28c40"/>
    </linearGradient>

    <!-- Subtle line glow -->
    <filter id="subtleGlow" x="-35%" y="-35%" width="170%" height="170%">
      <feGaussianBlur stdDeviation="4.5" result="blur1"/>
      <feGaussianBlur stdDeviation="11" result="blur2"/>
      <feMerge>
        <feMergeNode in="blur2"/>
        <feMergeNode in="blur1"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <circle cx="256.0" cy="256.0" r="254.0" fill="url(#skyGrad)"/>

  <!-- Celestial Line-Art: Sun & Moon combined into one white line-art circle -->
  <g filter="url(#subtleGlow)" stroke="#ffffff" stroke-width="8.0" stroke-linecap="round" stroke-linejoin="round" fill="none">
    
    <!-- Central Circle -->
    <circle cx="268.0" cy="268.0" r="124.0"/>

    <!-- Crescent Moon Arc on Bottom-Right -->
    <path d="M 355.68 180.32 A 141.42 141.42 0 0 1 180.32 355.68"/>

    <!-- Sun Rays on Top-Left -->
    <line x1="141.12" y1="327.17" x2="121.18" y2="336.46" stroke-width="8.00"/>
    <line x1="129.20" y1="286.27" x2="121.27" y2="287.32" stroke-width="6.40"/>
    <line x1="130.13" y1="243.69" x2="108.46" y2="239.87" stroke-width="8.00"/>
    <line x1="143.82" y1="203.36" x2="136.72" y2="199.66" stroke-width="6.40"/>
    <line x1="169.01" y1="169.01" x2="144.96" y2="144.96" stroke-width="8.00"/>
    <line x1="203.36" y1="143.82" x2="199.66" y2="136.72" stroke-width="6.40"/>
    <line x1="243.69" y1="130.13" x2="239.87" y2="108.46" stroke-width="8.00"/>
    <line x1="286.27" y1="129.20" x2="287.32" y2="121.27" stroke-width="6.40"/>
    <line x1="327.17" y1="141.12" x2="336.46" y2="121.18" stroke-width="8.00"/>
  </g>
</svg>